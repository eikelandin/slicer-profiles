version = 1
SPDX-PackageName = "slicer-profiles"
SPDX-PackageDownloadLocation = "https://github.com/eikelandin/slicer-profiles"

# Code, docs, the docs site and the manifest schema: MIT.
[[annotations]]
path = [
    "src/**",
    "scripts/**",
    "tests/**",
    ".github/**",
    "docs/**",
    "schemas/**",
    "site/src/**",
    "README.md",
    "AGENTS.md",
    "CLAUDE.md",
    "pyproject.toml",
    "uv.lock",
    "upstream.lock.toml",
    ".python-version",
    ".gitignore",
    "REUSE.toml",
    "site/scripts/**",
    "site/package.json",
    "site/package-lock.json",
    "site/docusaurus.config.js",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ESchuderer"
SPDX-License-Identifier = "MIT"

# Repository widget: own code plus GitHub Octicons icon paths (https://github.com/primer/octicons), both MIT.
[[annotations]]
path = "site/src/components/RepoWidget.tsx"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 ESchuderer", "2026 GitHub Inc."]
SPDX-License-Identifier = "MIT"

# Own data: the tables and the generated presets (golden files, licensed like the release zip). Values
# taken from maker data sheets, slicer stock profiles and filament databases are cited as third-party
# facts, and the stock parents are named, not copied.
[[annotations]]
path = ["config/**", "tests/golden/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ESchuderer"
SPDX-License-Identifier = "CC0-1.0"
